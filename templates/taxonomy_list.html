{% extends "base.html" %}

{% block content %}
<h1 class="title">All Categories</h1>

<ul>
  {% for term in terms %}
    <li>
      <a href="{{ term.permalink }}">{{ term.name }}</a>
      ({{ term.page_count }} post{% if term.page_count > 1 %}s{% endif %})
    </li>
  {% endfor %}
</ul>
{% endblock content %}
